[workspace]
resolver = "2"
members = ["crates/must-gather", "crates/qa-test"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/glennswest/stormcos_qa"

# Zero build warnings (stormcentral#193): a warning fails the build.
[workspace.lints.rust]
warnings = "deny"

[profile.release]
lto = true
# Keep the symbol table: crash.rs prints a symbolized backtrace (#26).
strip = "debuginfo"
