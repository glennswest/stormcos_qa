# optional source and note, no other keys. stormcentral ignores the
# [[known]] entries above, and check.py ignores these; until check.py
# reads [[line]] (stormcos_qa#70), an open [[known]] entry is repeated here.
# Lines whose issue closed after the release was built (12.18-flowsdn:
# stormraid#62, stormblock-registry#126, stormuefi#62) are not listed: the
# release predates the fix.
# ======================================================================

