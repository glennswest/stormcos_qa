# Known boot-console lines (stormcos#545, stormcos_qa#67).
#
# From power-on to login, every console line that matches [match] is either
# fixed (it no longer appears) or explained here: a pattern, the open issue
# that explains it, and the project that owns the fix. `bootlog/check.py`
# applies this file to a console capture and lists what is left.
#
# Rules for entries:
# - `pattern` is a Python regex searched in the cleaned line (escape codes
#   and CRs stripped). Keep it to the message's fixed words, so a timestamp,
#   pid or port does not stop it matching, and narrow enough that a new,
#   different failure of the same service is not swallowed.
# - `issue` must be open. When it closes, its lines should be gone: the next
#   review removes the entry, or reopens/refiles if the line is still there.
# - `seen` names the review that added it (release, machines).

[match]
# The words of stormcos#545. BUG and Call Trace are the kernel's own and
# case-sensitive: case-insensitively, "bug" matches every DEBUG line.
pattern = '(?i:error|warn|fail|taint|timed out|denied)|Call Trace|BUG'

# Words that match [match] but say nothing went wrong. They are removed
# before matching; a line is a finding only if a match word is left.
[[not_a_finding]]
pattern = '\bDEBUG\b'
why = "log level, not the kernel's BUG"

[[not_a_finding]]
pattern = '\bfailed=false\b'
why = "stormd's run record of a clean exit"

[[not_a_finding]]
pattern = '\b0 failed\b'
why = "stormpump's 'boot complete — N started, 0 failed' (seen 12.21)"

# ---- boot media and loader (stormbootx, stormuefi) ----

[[known]]
pattern = 'Secure Boot off - a pallet not signed by one boots with a warning|WARNING: unsigned - booting anyway, Secure Boot is off'
issue = "stormuefi#61"
owner = "stormuefi"
note = "releases are not signed yet; refusing unsigned pallets waits on signing"
seen = "12.16 pvetest1, pvetest2"

