pattern = 'apimachinery::reflector: reflector WATCH reconnecting url=\S+/apis/discovery\.k8s\.io/v1/endpointslices error=watch event rejected by its consumer; relisting'
issue = "glennswest/rustkube#272"

[[line]]
pattern = 'controller="deployment" .*error=None|error=Some\(HTTP status client error \(409 Conflict\)'
issue = "glennswest/rustkube#273"
note = "reconciles logged as failed with no error, or on an optimistic-concurrency 409"

[[line]]
pattern = 'apiserver::manifests: manifests: .* 0 failed(\s+×\d+)?\s*$'
issue = "glennswest/stormcentral#842"
note = "'0 failed' is not a finding"

[[line]]
pattern = '(stormdrive|vmimages)::tls: no serving certificate at /data/stormcert/\S+ / /data/stormcert/\S+: a TLS handshake fails'
issue = "glennswest/stormcos#548"

[[line]]
pattern = 'kubelet::pv_placement: drive locations unavailable|GET \S+/api/v1/placement: gave up after \d+ attempts|stormcluster::forge: forge: GET http://127\.0\.0\.1:9090/api/v1/forge: error sending request|stormstorage::registry: engine refused /api/v1/discovery: 401 \(engine token missing or wrong\); sent no token'
issue = "glennswest/stormcos#567"
note = "callers that start before stormdrive (:9092) or the engine (:9090, its token) answers"

# ---- 12.20-flowsdn pvetest2 review ----

[[line]]
pattern = 'stormblock::mgmt::debug: (stall: \S+ \S+ \(req \d+\) for \d+s: waits on the slab registry: held [\d.]+s by the flow-over|ublk: \d+ request\(s\) unanswered for 30s or more: |api: \S+ \S+ \d{3} \d+ms lock-wait \d{4,}ms )'
issue = "glennswest/stormblock#269"
note = "flow-over holds the slab registry (write) 15-20 s; API readers and the ublk data path wait behind it"

[[line]]
pattern = 'fastetcd::stall: a checkpoint of the data file .* has not returned for \d+ s: its fsync is stuck below fastetcd|ERROR API STALLED — no answer process=(fastetcd|apiserver) |fastetcd::health: (serving /health false reason=RANGE ERROR:context deadline exceeded|grpc\.health\.v1: NOT_SERVING)|\[-\](serializable|linearizable)_read failed: context deadline exceeded|retry: stormblock GET /api/v1/slabs: infrastructure: gave up after \d+ attempts / [\d.]+ s: .*operation timed out'
issue = "glennswest/stormblock#269"
note = "consequences of the flow-over I/O stall: fastetcd's fsync waits on ublk, then etcd and the apiserver stop answering (12.20-flowsdn pvetest2, ~15 s)"

[[line]]
pattern = 'stormblock::mgmt::debug: api: GET /serve/v1/ready 503 '
issue = "glennswest/stormblock#432"

[[line]]
pattern = '(vmimages\| vmimages\||vmimages\[\d\]( vmimages\|)?)\s+\(os error\s*$'
issue = "glennswest/stormcos#548"
note = "a cut piece of vmimages' first-boot 'No such file or directory (os error 2)'"

[[line]]
pattern = 'plugin_kubernetes::cache: list failed kind="\w+" error=http: error sending'
issue = "glennswest/stormcos#567"

# ---- 12.20 pvetest1 review (first cilium pod logs) ----

[[line]]
pattern = 'subsys=hubble-relay address=\S+:4244 tls=true peer=\S+ error="unexpected TLS ServerName '
issue = "glennswest/stormcos#327"
note = "the relay has no client pair yet (disable-client-tls) while Hubble's :4244 is mutual TLS"

[[line]]
pattern = 'msg="Initial TLS configuration load failed, certificate files might not yet be available'
issue = "glennswest/stormcos#327"
note = "cilium starts before the four TLS Secrets are written"

[[line]]
pattern = "level=info msg=\"  --[\\w.-]+='[^']*'\"|level=info msg=\"Managing Cilium Node Taints|(restored|regenerated)=\\d+ failed=0( |$)"
issue = "glennswest/stormcentral#842"
note = "cilium's flag dump and counters: 'failure', 'errors', 'taint' inside option names, failed=0"

[[line]]
pattern = 'msg="Failed to setup socket load-balancing tracing with Hubble\.|msg="Waiting for k8s node information" .*required IPv4 PodCIDR not available|msg="Unable to (get|update) CiliumNode resource|msg="Restoring proxy ports from file failed|msg="CiliumEndpointSlice CRD cannot be found|msg="Failed to update lease" subsys=klog error="resource version mismatch" lock=kube-system/cilium-operator|msg="Failed to create peer notify client for peers change notification'
issue = "glennswest/stormcos-cilium#34"

[[line]]
pattern = '^\[stormupdate\] .*","\w+":'
issue = "glennswest/stormupdate#23"
note = "pieces of the PodList body kube_client dumps at WARN (cut, stormd#65)"

[[line]]
pattern = 'stormblock::mgmt::debug: stall: \S+ \S+ \(req \d+\) for \d+s: waits on no tracked lock|stormblock::mgmt::debug: api: DELETE /api/v1/volumes/\S+ 204 \d{5,}ms lock-wait 0ms'
issue = "glennswest/stormblock#431"
note = "a wait the engine cannot attribute"
