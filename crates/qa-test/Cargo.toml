[package]
name = "stormcos-qa-test"
description = "stormcos_qa's test container: /test short|medium|long|turbomode (+ serve, agent, claim, sleep, sqlite helpers), per stormcentral docs/test-standard.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = "0.63"
getrandom = "0.2"
# turbomode's SQLite workload (#26): SQLite built in, for the scratch image.
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.11"
# The one retry helper (#57), shared with must-gather in glennswest/stormgather
# (#48). The same rev is the must-gather test/build.sh puts in the image.
retry = { package = "stormgather-retry", git = "https://github.com/glennswest/stormgather", rev = "ec725cc5528b3b98ff5280745393e8f4b18b263e" }
# crash.rs: a SIGSEGV/SIGBUS handler that names the place (#26).
libc = "0.2"
