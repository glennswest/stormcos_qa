# What stormcos_qa's suites need beyond the runner's namespace-only Role, in
# the form proposed in stormcentral#55 (not read by the runner yet). Until it
# is, the checks that need these report "could not run" (exit 2), never pass.

[short]
# nothing beyond the run namespace

[medium]
# The isolated namespace (#18): the driver must stay outside it, because a
# pod inside cannot reach the apiserver once storm-isolate applies. The
# runner creates it next to the run namespace, run-labelled, with the same
# Role bound to the run's ServiceAccount, and passes its name as
# STORM_NAMESPACE_ISO.
extra_namespaces = ["iso"]
requires = ["kvm"]

[long]
# VM waves are sized from the node's allocatable memory (#16), container
# waves from its free pod slots: allocatable pods less the pods bound to it
# (#17). The container waves' drain checks that the claims' PersistentVolumes
# are gone, and counts PVs for the residue trend.
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "pods" },
  { apiGroup = "", resource = "persistentvolumes" },
]
# stormvm's API is loopback-only on stormcos; taps and pod veths are counted
# from the host's /proc/net/dev; the wave's Service is reached at its ClusterIP.
host_network = true
# stormblock answers volume calls only with its token (stormblock#107); the
# drain lists volumes to prove nothing was left. As STORMBLOCK_API_TOKEN.
stormblock_token = true
requires = ["kvm"]

[turbomode]
# The turbomode SQLite reclamation audit (#26, owner 2026-09-29): on the node
# as a test Job, no ssh. Host access is read-only; nothing on the host is
# writable. The runner's Job spec cannot express this yet (stormcentral#74).
host_pid = true
host_paths_read_only = [
  "/proc",
  "/sys/fs/cgroup",
  "/proc/1/mountinfo",
  "/run/stormblock/engine/api_token",   # the file only, not /run
]
# The node name, for the one-node check: downward API spec.nodeName as TURBOMODE_NODE.
downward_node_name = "TURBOMODE_NODE"
