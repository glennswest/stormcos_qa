# What stormcos_qa's suites need beyond the runner's namespace-only Role.
# The runner reads budget_secs (stormcentral#247) and the host access
# fields (host_network, host_pid, host_paths_read_only, downward_node_name:
# stormcentral#74; read-only host paths appear at /host<path>, named by
# STORM_HOST_ROOT) and cluster_read (stormcentral#55). extra_namespaces is
# a proposal, not read yet; until it is, the checks that need it report
# "could not run" (exit 2), never pass.

[short]
# The smoke test (#34): every Node Ready, every platform pod up. Platform
# pods are found cluster-wide, outside the runner's test namespaces.
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "namespaces" },
  { apiGroup = "", resource = "pods" },
]
# The golden check asks stormblock (at the node, :9090) for the Linux golden;
# stormblock answers volume calls only with its token (stormblock#107, #42).
host_paths_read_only = [
  "/run/stormblock/engine/api_token",   # the file only, not /run
]

[medium]
# The isolated namespace (#18): the driver must stay outside it, because a
# pod inside cannot reach the apiserver once storm-isolate applies. The
# runner creates it next to the run namespace, run-labelled, with the same
# Role bound to the run's ServiceAccount, and passes its name as
# STORM_NAMESPACE_ISO.
extra_namespaces = ["iso"]
requires = ["kvm"]

[long]
# VM waves are sized from the node's allocatable memory (#16), container
# waves from its free pod slots: allocatable pods less the pods bound to it
# (#17). The container waves' drain checks that the claims' PersistentVolumes
# are gone, and counts PVs for the residue trend.
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "pods" },
  { apiGroup = "", resource = "persistentvolumes" },
]
# stormvm's API is loopback-only on stormcos; taps and pod veths are counted
# from the host's /proc/net/dev; the wave's Service is reached at its ClusterIP.
host_network = true
# The stormblock engine's own memory is read from its /proc/<pid>/status
# (#36): only the host's PID namespace shows it.
host_pid = true
# stormblock answers volume calls only with its token (stormblock#107); the
# drain lists volumes to prove nothing was left. The runner never read the
# proposed `stormblock_token`: the engine's file is mounted read-only instead.
host_paths_read_only = [
  "/run/stormblock/engine/api_token",   # the file only, not /run
]
requires = ["kvm"]

[container-waves]
# #17's container waves alone, sized for a day run: `/test container-waves`
# is `long --kinds containers --waves 3 --max-pods 20` (10, 20, 15 pods,
# each with its own stormblock claim). By day a test fits 15 min and `long`
# (8 h) runs only at night on a pve VM (stormcentral#325), so this is what
# runs the container waves on bare metal and by day. No kvm needed.
budget_secs = 900
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "pods" },
  { apiGroup = "", resource = "persistentvolumes" },
]
# Pod veths are counted from the host's /proc/net/dev; stormblock's API at
# <node>:9090.
host_network = true
# The stormblock engine's own memory is read from its /proc/<pid>/status
# (#36): only the host's PID namespace shows it.
host_pid = true
# The drain lists stormblock volumes to prove the claims' volumes are gone;
# stormblock answers only with its token (stormblock#107).
host_paths_read_only = [
  "/run/stormblock/engine/api_token",   # the file only, not /run
]

[vm-waves]
# #16's VM waves alone, sized for a day run: `/test vm-waves` is `long
# --kinds vms --waves 2 --min-vms 2 --max-vms 10` with shorter step bounds.
# 1800 s is the most a day run may take (stormcentral#325).
budget_secs = 1800
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "persistentvolumes" },
]
# stormvm's API is loopback-only on stormcos; taps are counted from the
# host's /proc/net/dev; RDP and stormblock are reached at the node.
host_network = true
# The stormblock engine's own memory is read from its /proc/<pid>/status
# (#36): only the host's PID namespace shows it.
host_pid = true
# The golden check and the drain's volume list need stormblock's token.
host_paths_read_only = [
  "/run/stormblock/engine/api_token",   # the file only, not /run
]
requires = ["kvm"]

[turbomode]
# How long the run may take (stormcentral#247): the Job's STORM_TIMEOUT and,
# plus a 180 s start grace, its activeDeadlineSeconds. By day a golden's
# test fits 15 min (#43, stormcentral#325). Two profiles, up to 2 attempts
# each; an attempt starts only if its worst case (finish 240 s + cleanup
# 120 s + 120 s) still fits, so a cut-off never loses its cleanup.
budget_secs = 900
# `/test turbomode` (#26; owner's option A on #33): 100 sleeping Pods,
# then 25 Pod+PVC pairs, all in the run namespace (no extra namespaces).
# Cleanup and the one-node check read cluster-scoped objects: the PVs of
# the run's claims, their VolumeAttachments, and the nodes.
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "persistentvolumes" },
  { apiGroup = "storage.k8s.io", resource = "volumeattachments" },
  { apiGroup = "storage.k8s.io", resource = "storageclasses" },
]
# The SQLite reclamation audit (owner 2026-09-29): on the node, in this Job,
# no ssh. Host access is read-only; nothing on the host is writable. The
# paths appear at /host<path>; host init's mountinfo is read through /proc
# (/host/proc/1/mountinfo).
host_pid = true
host_paths_read_only = [
  "/proc",
  "/sys/fs/cgroup",
  "/run/stormblock/engine/api_token",   # the file only, not /run
]
# The node name, for the one-node check: downward API spec.nodeName as TURBOMODE_NODE.
downward_node_name = "TURBOMODE_NODE"

[turbomode-night]
# The full scale (#43): 1,000 sleeping Pods, then 100 Pod+PVC pairs, up to
# 3 attempts each (finish 3600 s + cleanup 600 s + 120 s). Over 30 min, so
# stormcentral runs it only in the night window, on a pve VM (#325). The
# same driver and the same needs as [turbomode].
budget_secs = 14400
# Cleanup and the one-node check read cluster-scoped objects: the PVs of
# the run's claims, their VolumeAttachments, and the nodes.
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "persistentvolumes" },
  { apiGroup = "storage.k8s.io", resource = "volumeattachments" },
  { apiGroup = "storage.k8s.io", resource = "storageclasses" },
]
# The SQLite reclamation audit (owner 2026-09-29): on the node, in this Job,
# no ssh. Host access is read-only; nothing on the host is writable. The
# paths appear at /host<path>; host init's mountinfo is read through /proc
# (/host/proc/1/mountinfo).
host_pid = true
host_paths_read_only = [
  "/proc",
  "/sys/fs/cgroup",
  "/run/stormblock/engine/api_token",   # the file only, not /run
]
# The node name, for the one-node check: downward API spec.nodeName as TURBOMODE_NODE.
downward_node_name = "TURBOMODE_NODE"

[must-gather]
# must-gather (#45) run in-cluster against this machine: cluster state
# through the API, then a collector pod per node in the run namespace
# (hostPID, hostNetwork, read-only host mounts: the run's Role covers pods in
# its namespace, which has no PodSecurity label), and the bundle checked.
# The reads are must-gather's list; the runner grants no subresource, so
# kube-system's pods/log answers 403 here (the host bundle has those logs).
budget_secs = 900
cluster_read = [
  { apiGroup = "", resource = "nodes" },
  { apiGroup = "", resource = "namespaces" },
  { apiGroup = "", resource = "pods" },
  { apiGroup = "", resource = "events" },
  { apiGroup = "", resource = "services" },
  { apiGroup = "", resource = "endpoints" },
  { apiGroup = "", resource = "persistentvolumes" },
  { apiGroup = "", resource = "persistentvolumeclaims" },
  { apiGroup = "", resource = "serviceaccounts" },
  { apiGroup = "apps", resource = "deployments" },
  { apiGroup = "apps", resource = "daemonsets" },
  { apiGroup = "apps", resource = "statefulsets" },
  { apiGroup = "apps", resource = "replicasets" },
  { apiGroup = "batch", resource = "jobs" },
  { apiGroup = "storage.k8s.io", resource = "storageclasses" },
  { apiGroup = "storage.k8s.io", resource = "volumeattachments" },
  { apiGroup = "storage.k8s.io", resource = "csidrivers" },
  { apiGroup = "storage.k8s.io", resource = "csinodes" },
  { apiGroup = "coordination.k8s.io", resource = "leases" },
  { apiGroup = "networking.k8s.io", resource = "networkpolicies" },
  { apiGroup = "apiextensions.k8s.io", resource = "customresourcedefinitions" },
  { apiGroup = "scheduling.k8s.io", resource = "priorityclasses" },
  { apiGroup = "kubevirt.io", resource = "virtualmachines" },
  { apiGroup = "kubevirt.io", resource = "virtualmachineinstances" },
]
